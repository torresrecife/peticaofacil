# So no DDEV (nao vai para producao): aqui o sistema roda na raiz do dominio,
# mas os textos salvos no banco trazem imagens com o caminho antigo
# (/peticaofacil/img/..., /peticaofacil2/img/..., /peticaofacil2/public/img/...).
# Arquivos estaticos com esse prefixo sao servidos de public/ sem o prefixo;
# qualquer outro endereco antigo redireciona para o mesmo caminho na raiz.
location ~ ^/peticaofacil2?(?:/public)?/(?:img|ckfinder|ckeditor|css|js|vendor|fonts)/ {
    rewrite ^/peticaofacil2?(?:/public)?(/.*)$ $1 last;
}

location ~ ^/peticaofacil2?(?:/public)?(?:/(?<pf_rest>.*))?$ {
    absolute_redirect off; # mantem a porta do roteador (:8080)
    return 301 /$pf_rest$is_args$args;
}
